# Continuous integration: backend pytest, frontend lint/typecheck/test/build.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      # Tests run against a throwaway Postgres with pgvector (see tests/conftest.py).
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docassist
          POSTGRES_PASSWORD: docassist
          POSTGRES_DB: docassist_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U docassist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Backend/requirements.txt
            Backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first: Docling needs torch, and the default build pulls GBs of CUDA.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_WEBHOOK_URL: ""
        run: pytest -q

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
