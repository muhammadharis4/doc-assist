# DocAssist stack: Next.js frontend (reverse proxy routes) + FastAPI backend + Postgres/pgvector (dev topology).
#
# Prerequisites on the host:
# - Ollama running on the machine (recommended). Backend reaches it via:
#     OLLAMA_BASE_URL=http://host.docker.internal:11434 (default below on Linux-compatible Docker).
#
# Commands:
#   docker compose build
#   docker compose up
#
# Frontend: http://localhost:3000 — /api/* is forwarded to the backend (build arg BACKEND_API_URL=http://backend:8000)
# Backend: http://localhost:8000/docs
#
# SECURITY
# - Postgres uses a demo password — local ONLY. Production: set a real DATABASE_URL secret.
# - Postgres port 5432 is NOT published to the host; only backend reaches it on the
#   internal network. Temporarily add "5432:5432" under `postgres` for debugging only.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time: the frontend's /api rewrites point here (see frontend/next.config.ts).
        BACKEND_API_URL: http://backend:8000
    ports:
      - "3000:3000"

    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Watched folder (WATCH_FOLDER defaults to "Sample data"): files dropped here are ingested.
      - "./Backend/Sample data:/app/Sample data:ro"
    environment:
      DATABASE_URL: postgresql://docassist:docassist@postgres:5432/docassist
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      # Allows Linux Docker to resolve host.docker.internal like Docker Desktop does.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # Plain Postgres has no `vector` type; this image is Postgres + pgvector.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: docassist
      POSTGRES_PASSWORD: docassist
      POSTGRES_DB: docassist
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docassist"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
